name: Test diff-store option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Magic Nix Cache action with diff-store enabled
        id: action
        uses: .
        with:
          diagnostic-endpoint: ""
          use-flakehub: "disabled"
          use-gha-cache: "disabled"
          diff-store: "true"

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully with diff-store enabled"
          echo "PASS"
