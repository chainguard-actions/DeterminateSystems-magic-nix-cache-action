name: Test source-binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake magic-nix-cache binary
        run: |
          mkdir -p /tmp/fake-mnc
          cat > /tmp/fake-mnc/magic-nix-cache << 'EOF'
          #!/bin/sh
          echo "fake magic-nix-cache binary invoked with: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-mnc/magic-nix-cache

      - name: Run Magic Nix Cache action with source-binary
        id: action
        uses: .
        with:
          source-binary: /tmp/fake-mnc/magic-nix-cache
          diagnostic-endpoint: ""
          use-flakehub: "disabled"
          use-gha-cache: "disabled"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with source-binary input (outcome: ${{ steps.action.outcome }})"
