name: Test source-binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake binary for source-binary input
        run: |
          mkdir -p /tmp/fake-nix-cache
          cat > /tmp/fake-nix-cache/magic-nix-cache << 'EOF'
          #!/bin/sh
          echo "fake magic-nix-cache binary invoked with: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-nix-cache/magic-nix-cache
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-binary: "/tmp/fake-nix-cache/magic-nix-cache"
          use-gha-cache: "disabled"
          use-flakehub: "disabled"
          diagnostic-endpoint: ""
      - name: Assert action ran (source-binary input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with source-binary input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
