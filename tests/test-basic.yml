name: Test basic usage (no Nix, no cache env vars)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Magic Nix Cache action (expect graceful no-op)
        id: action
        uses: .
        with:
          # Disable diagnostics to avoid network calls
          diagnostic-endpoint: ""
          # Disable FlakeHub to avoid network calls
          use-flakehub: "disabled"
          # Disable GHA cache (no ACTIONS_CACHE_URL available under act)
          use-gha-cache: "disabled"

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (graceful no-op without Nix/cache env vars)"
          echo "PASS"
