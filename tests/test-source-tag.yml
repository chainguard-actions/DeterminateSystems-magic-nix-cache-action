name: Test source-tag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: "v0.0.1"
          use-gha-cache: "disabled"
          use-flakehub: "disabled"
          diagnostic-endpoint: ""
      - name: Assert action ran with source-tag input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with source-tag"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with source-tag (expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
